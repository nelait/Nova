<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plan Ops Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="/theme.css" />
<script>
  // Apply the saved theme before first paint so the page never flashes the wrong theme.
  try { const t = localStorage.getItem('planops.theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: none; box-shadow: var(--focus); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---- shell: sidebar + content */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--line); min-width: 0; }
  .side-inner > * { min-width: 0; }
  .side-inner { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
  .brand svg { flex: none; }
  .brand b { font: 700 17px/1.1 var(--font-display); letter-spacing: -0.01em; }
  .brand span { display: block; font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
  nav#tabs { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .navgroup { display: flex; flex-direction: column; gap: 2px; }
  .navgroup > span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 10px 4px; }
  nav#tabs button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; padding: 7px 10px; border-radius: var(--radius-sm); color: var(--ink); cursor: pointer; font: inherit; font-size: 14px; }
  nav#tabs button:hover { background: var(--surface-2); }
  nav#tabs button.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  nav#tabs button .count { margin-left: auto; font: 600 11.5px/1 var(--font-mono); padding: 3px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); }
  .side-foot { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
  .side-foot label { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 400; }
  .themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2px; background: var(--surface-2); border-radius: var(--radius-sm); }
  .themes button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; padding: 5px 0; border-radius: 4px; cursor: pointer; }
  .themes button[aria-pressed='true'] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }
  .content { min-width: 0; display: flex; flex-direction: column; }
  .pagehead { padding: 22px 28px 6px; }
  .pagehead h1 { margin: 0; font: 600 26px/1.15 var(--font-display); letter-spacing: -0.015em; text-wrap: balance; }
  .pagehead p { margin: 4px 0 0; color: var(--muted); }
  main { padding: 14px 28px 40px; max-width: 1360px; width: 100%; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
    .side-inner { position: static; height: auto; gap: 10px; padding: 12px 16px; }
    nav#tabs { flex-direction: row; overflow-x: auto; gap: 4px; scrollbar-width: none; }
    .navgroup { flex-direction: row; gap: 4px; }
    .navgroup > span { display: none; }
    nav#tabs button { white-space: nowrap; width: auto; }
    .side-foot { flex-direction: row; flex-wrap: wrap; align-items: end; border-top: 0; padding-top: 0; }
    .side-foot > div { flex: 1 1 180px; min-width: 0; }
    .pagehead { padding: 16px 16px 4px; }
    main { padding: 10px 16px 32px; }
  }

  /* ---- components */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; overflow-wrap: break-word; }
  .grid2 { display: grid; grid-template-columns: minmax(270px, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .grid2 > * { min-width: 0; }
  td:last-child { overflow-wrap: anywhere; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  h2 { font: 600 17px/1.25 var(--font-display); margin: 0 0 12px; letter-spacing: -0.005em; }
  h3 { font: 700 11.5px/1.3 var(--font-body); margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .item { padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 8px; cursor: pointer; background: var(--surface); transition: border-color .12s, box-shadow .12s; }
  .item:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .item.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .muted { color: var(--muted); } .small { font-size: 12.5px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); font: 500 11.5px/1.5 var(--font-mono); margin-right: 4px; letter-spacing: .01em; }
  .chip.AUTO { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--ok); }
  .chip.REVIEW { background: color-mix(in srgb, var(--info) 14%, var(--surface)); color: var(--info); }
  .chip.MANUAL { background: var(--brass-soft); color: var(--brass); }
  .chip.DONE, .chip.COMPLETED, .chip.ACTIVE { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--ok); }
  .chip.READY, .chip.OPEN, .chip.IN_PROGRESS { background: color-mix(in srgb, var(--info) 12%, var(--surface)); color: var(--info); }
  .chip.BLOCKED, .chip.SKIPPED, .chip.CANCELLED, .chip.TERMINATED, .chip.TERMINATING, .chip.ONBOARDING { color: var(--muted); }
  .chip.exception { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad); font-weight: 600; }
  :root[data-theme='contrast'] .chip { border: 1px solid var(--line); }
  .alert { border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); border-left: 4px solid var(--warn); padding: 8px 12px; background: color-mix(in srgb, var(--warn) 7%, var(--surface)); margin: 6px 0; border-radius: var(--radius-sm); }
  .alert.bad, .alert.high { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); border-left-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
  .alert.low { border-color: var(--line); border-left-color: var(--muted); background: var(--surface-2); }
  button.btn { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; transition: filter .12s; }
  button.btn:hover { filter: brightness(1.08); }
  button.btn:disabled { opacity: .6; cursor: progress; }
  button.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
  button.btn.secondary:hover { background: var(--surface-2); filter: none; }
  button.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 7px 10px; width: 100%; }
  textarea { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; }
  label { display: block; margin: 10px 0 4px; font-weight: 700; font-size: 13px; }
  code { font-family: var(--font-mono); font-size: .9em; }
  pre { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); padding: 10px 12px; border-radius: var(--radius-sm); overflow: auto; max-height: 340px; margin: 0; white-space: pre-wrap; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .scroll { overflow-x: auto; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 1; min-width: 140px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .toast { position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 460px; margin-left: auto; padding: 12px 16px; border-radius: var(--radius-sm); background: var(--ink); color: var(--bg); display: none; z-index: 5; box-shadow: var(--shadow); white-space: pre-line; }
  .steps { display: flex; flex-direction: column; gap: 6px; }
  .step { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
  ul.check { padding-left: 0; list-style: none; margin: 0; } ul.check li { margin: 4px 0; }
  ul.check input { width: auto; margin-right: 6px; accent-color: var(--accent); }
  .ai { border: 1px solid var(--line); border-left: 4px solid var(--brass); border-radius: var(--radius-sm); padding: 12px 14px; margin: 14px 0; background: color-mix(in srgb, var(--brass-soft) 45%, var(--surface)); }
  .ai .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ai h3 { margin: 0; color: var(--brass); }
  table.metrics td:first-child { white-space: nowrap; font-size: 12.5px; color: var(--muted); }
  table.metrics td:nth-child(2) { min-width: 210px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .kpi b { font: 600 30px/1.1 var(--font-display); display: block; font-variant-numeric: tabular-nums; }
  body:not(.is-admin) .admin-only, body:not(.dev-mode) .dev-only, body.sso .dev-only { display: none !important; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who .avatar { flex: 0 0 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; }
  .who div { min-width: 0; } .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .who span { font-size: 12px; color: var(--muted); }
  .who button { margin-left: auto; flex: 0 0 auto; }
  .devnote { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius-sm); padding: 6px 8px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar"><div class="side-inner">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="var(--accent)"/><path d="M8 9h14M8 15h9M8 21h5" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/><circle cx="21" cy="20" r="3.2" fill="var(--brass)"/></svg>
      <div><b>Plan Ops Hub</b><span>Retirement plan operations</span></div>
    </div>
    <nav id="tabs" aria-label="Sections"></nav>
    <div class="side-foot">
      <div class="who" id="who" hidden></div>
      <div class="dev-only"><label for="userSel">Working as</label><select id="userSel"></select>
        <p class="devnote" style="margin:6px 0 0">Development mode: no sign-in, this computer only. <a href="/site/docs/sign-in.html">Set up single sign-on</a></p></div>
      <div><label id="themeLabel">Theme</label><div class="themes" role="group" aria-labelledby="themeLabel" id="themes">
        <button data-theme-choice="system">Auto</button><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button><button data-theme-choice="contrast" title="High contrast">High</button>
      </div></div>
    </div>
  </div></aside>
  <div class="content">
    <header class="pagehead"><h1 id="pageTitle">My work</h1><p id="pageSub"></p></header>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const state = { tab: 'inbox', user: null, mode: 'dev', me: null, selTask: null, selCase: null, ai: { enabled: false } };

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json' };
  // With single sign-on the session cookie identifies you; the header is only used in development mode.
  if (state.mode === 'dev') headers['x-user-id'] = state.user ?? 'anonymous';
  const res = await fetch('/api' + path, { method: opts.method ?? 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401) { location.href = '/auth/login?returnTo=' + encodeURIComponent(location.pathname + location.search); throw new Error('Signing you in…'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error + (data.issues?.length ? '\n• ' + data.issues.join('\n• ') : ''));
  return data;
}
function toast(msg, bad) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; t.style.background = bad ? 'var(--bad)' : ''; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = 'none'), bad ? 7000 : 3000); }
async function guarded(fn) { try { await fn(); } catch (e) { toast(e.message, true); } }

const TABS = { inbox: 'My work', intake: 'New request', cases: 'Cases', team: 'Team & skills', rules: 'Rules', integrations: 'Integrations', agents: 'Agents', trac: 'Recordkeeper', outbox: 'Outbox', insights: 'Insights' };
const NAV = [
  ['Work', ['inbox', 'intake', 'cases']],
  ['Process building blocks', ['rules', 'integrations', 'agents']],
  ['Organization', ['team', 'insights']],
  ['Connected systems', ['trac', 'outbox']],
];
const SUBTITLES = {
  inbox: 'Tasks routed to you, most urgent first',
  intake: 'Start an installation, a plan change or a termination',
  cases: 'Every request, its steps and its audit trail',
  team: 'Who can take which work, and how loaded they are',
  rules: 'Validations, calculations and decisions used by process steps',
  integrations: 'External systems the hub calls, and every call it made',
  agents: 'AI agents that propose results for people to approve',
  trac: 'The recordkeeper, read through its integration',
  outbox: 'Emails sent to plan sponsors',
  insights: 'How each step performs, and what to improve',
};
function renderTabs() {
  const myCount = state.myCount ?? 0;
  $('#tabs').innerHTML = NAV.map(([group, keys]) => `<div class="navgroup"><span>${group}</span>${keys.map((k) =>
    `<button data-tab="${k}" class="${state.tab === k ? 'active' : ''}" ${state.tab === k ? 'aria-current="page"' : ''}>${TABS[k]}${k === 'inbox' && myCount ? `<span class="count">${myCount}</span>` : ''}</button>`).join('')}</div>`).join('');
  $('#pageTitle').textContent = TABS[state.tab];
  $('#pageSub').textContent = SUBTITLES[state.tab] || '';
}
$('#tabs').onclick = (e) => { const b = e.target.closest('button[data-tab]'); if (b) { state.tab = b.dataset.tab; renderTabs(); render(); } };

// Theme: Auto (follow the OS), Light, Dark or High contrast. Saved per browser.
function applyTheme(choice) {
  if (choice === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = choice;
  document.querySelectorAll('[data-theme-choice]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeChoice === choice)));
  try { localStorage.setItem('planops.theme', choice); } catch {}
}
$('#themes').onclick = (e) => { const b = e.target.closest('[data-theme-choice]'); if (b) applyTheme(b.dataset.themeChoice); };
applyTheme((() => { try { return localStorage.getItem('planops.theme') || 'system'; } catch { return 'system'; } })());
$('#userSel').onchange = (e) => { state.user = e.target.value; state.selTask = null; try { localStorage.setItem('planops.user', state.user); } catch {} render(); };

const money = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/** Render an agent's JSON output: lists of objects as tables, text as paragraphs. */
function renderAgentOutput(out, schema) {
  const label = (k) => k.replace(/([A-Z])/g, ' $1').replace(/^./, (c) => c.toUpperCase());
  return Object.entries(out || {}).map(([k, v]) => {
    const desc = schema?.properties?.[k]?.description;
    let body;
    if (Array.isArray(v) && v.length && typeof v[0] === 'object') {
      const cols = Object.keys(v[0]);
      body = `<div class="scroll"><table class="small"><tr>${cols.map((c) => `<th>${esc(label(c))}</th>`).join('')}</tr>${v.map((row) => `<tr>${cols.map((c) => `<td>${esc(row[c])}</td>`).join('')}</tr>`).join('')}</table></div>`;
    } else if (Array.isArray(v)) body = v.length ? `<ul class="small">${v.map((x) => `<li>${esc(typeof x === 'object' ? JSON.stringify(x) : x)}</li>`).join('')}</ul>` : '<div class="small muted">None</div>';
    else if (schema?.properties?.[k]?.enum) body = `<span class="chip">${esc(v)}</span>`;
    else body = `<div>${esc(typeof v === 'object' ? JSON.stringify(v) : v) || '<span class="muted">—</span>'}</div>`;
    return `<div style="margin-bottom:8px"><div class="small"><b>${esc(label(k))}</b>${desc ? ` <span class="muted">${esc(desc)}</span>` : ''}</div>${body}</div>`;
  }).join('');
}

function fmtValue(v, format) {
  if (v === null || v === undefined) return '—';
  if (format === 'usd') return money(v);
  if (format === 'number') return Number(v).toLocaleString('en-US');
  if (format === 'percent') return (Number(v) * 100).toFixed(1) + '%';
  return esc(typeof v === 'object' ? JSON.stringify(v) : String(v));
}
const SEV = { error: 'bad', warning: '', info: 'low' };
function renderRuleResult(r) {
  const decisions = Object.entries(r.decisions);
  const outputs = r.outputMeta || [];
  return `${r.passed ? '<div class="small" style="color:var(--ok);font-weight:600">All blocking rules pass</div>' : '<div class="small" style="color:var(--bad);font-weight:600">Blocking rules failed</div>'}
    ${r.issues.map((i) => `<div class="alert ${SEV[i.severity]}"><span class="chip">${i.severity}</span>${esc(i.message)}${i.reference ? ` <span class="muted small">(${esc(i.reference)})</span>` : ''}</div>`).join('')}
    ${decisions.length ? `<div class="small" style="margin:8px 0">${decisions.map(([id, d]) => `<span class="chip">${esc(id)}: ${esc(Object.entries(d).filter(([k]) => k !== 'row').map(([k, v]) => `${k}=${v}`).join(', '))}</span>`).join('')}</div>` : ''}
    ${outputs.length ? `<table>${outputs.map((o) => `<tr><td>${esc(o.label)}</td><td style="text-align:right">${fmtValue(r.outputs[o.name], o.format)}</td></tr>`).join('')}</table>` : ''}
    <details style="margin-top:8px"><summary class="small muted">Rule trace (${r.trace.length} evaluations)</summary>
      <table class="small">${r.trace.map((t) => `<tr><td>${t.kind}</td><td>${esc(t.id)}</td><td><span class="chip ${t.outcome === 'pass' ? 'DONE' : t.outcome === 'fail' || t.outcome === 'error' ? 'exception' : ''}">${t.outcome}</span></td><td class="muted">${t.detail === undefined ? '' : esc(JSON.stringify(t.detail))}</td></tr>`).join('')}</table></details>`;
}
const fmtDate = (s) => (s ? s.slice(0, 16).replace('T', ' ') : '');
const statusChip = (t) => t.exception ? '<span class="chip exception">exception</span>' : `<span class="chip ${t.status}">${t.status}</span>`;

// ---------------------------------------------------------------- inbox
async function renderInbox(v) {
  const tasks = await api('/inbox/' + state.user);
  v.innerHTML = `<div class="grid2"><div class="panel"><h2>Inbox (${tasks.length})</h2><div id="list"></div></div><div class="panel" id="detail"><p class="muted">Select a work item.</p></div></div>`;
  $('#list').innerHTML = tasks.length ? tasks.map((t) => `<div class="item ${state.selTask === t.id ? 'sel' : ''}" data-id="${t.id}">
      <div><b>${esc(t.name)}</b></div>
      <div class="small muted">${esc(t.sponsorName)} · ${t.caseType}</div>
      <div class="small" style="margin-top:4px"><span class="chip ${t.mode}">${t.mode}</span>${statusChip(t)}${t.dueAt ? `<span class="muted">due ${fmtDate(t.dueAt)}</span>` : ''}</div></div>`).join('')
    : '<p class="muted">Nothing assigned to you. Submit a request under <b>New request</b>, or switch user.</p>';
  $('#list').onclick = (e) => { const it = e.target.closest('.item'); if (it) { state.selTask = it.dataset.id; renderInbox(v); } };
  if (state.selTask && tasks.some((t) => t.id === state.selTask)) renderTaskDetail($('#detail'), state.selTask);
}

async function renderTaskDetail(el, taskId) {
  const g = await api(`/tasks/${taskId}/guidance`);
  const p = g.prepared;
  let work = '';
  if (p?.kind === 'email') {
    work = `<h3>Drafted email (template: ${esc(p.template)})</h3>
      <div class="small"><b>To:</b> ${esc(p.to.join(', ') || '—')} ${p.cc.length ? `&nbsp; <b>Cc:</b> ${esc(p.cc.join(', '))}` : ''}</div>
      <label>Subject</label><input id="subj" value="${esc(p.subject)}" />
      <label>Body</label><textarea id="body" rows="14">${esc(p.body)}</textarea>`;
  } else if (p?.kind === 'system-update') {
    work = `<h3>Will ${esc(p.operation)} on ${esc(p.target)}</h3><pre>${esc(JSON.stringify(p.payload, null, 2))}</pre>`;
  } else if (p?.kind === 'agent') {
    const pr = p.proposal;
    work = `<h3>AI agent: ${esc(p.name)} <span class="muted">(${esc(p.agent)} v${p.version})</span></h3>
      ${pr ? `<div class="small muted">Proposed by ${esc(pr.servedBy)} · ${fmtDate(pr.createdAt)}${pr.toolCalls.length ? ' · looked up: ' + pr.toolCalls.map((c) => `<span class="chip ${c.ok ? 'DONE' : 'exception'}">${esc(c.tool)}${c.ok ? '' : ' failed'}</span>`).join('') : ''}</div>
        ${pr.schemaIssues.length ? `<div class="alert bad">Proposal doesn't match the expected format: ${pr.schemaIssues.map(esc).join('; ')}</div>` : ''}
        <div class="ai" style="margin-top:8px">${renderAgentOutput(pr.output, p.outputSchema)}</div>
        <p class="small muted">This is a proposal. Nothing happens until you approve it; later steps use only the approved result.</p>`
      : '<p class="small">No proposal yet. Run the agent again, or enter the result yourself below.</p>'}
      <details ${pr ? '' : 'open'}><summary class="small"><b>${pr ? 'Edit the result before approving' : 'Enter the result'}</b> (JSON)</summary>
        <textarea id="agentOut" rows="14">${esc(JSON.stringify(p.editable, null, 2))}</textarea></details>
      <div class="actions" style="margin-top:6px"><button class="btn secondary" id="agentRerun">Run agent again</button></div>`;
  } else if (p?.kind === 'integration') {
    work = `<h3>External call</h3><p><b>${esc(p.systemName)}</b> → <code>${esc(p.operation)}</code> <span class="chip">${esc(p.method)}</span><span class="chip ${p.writes ? 'MANUAL' : 'AUTO'}">${p.writes ? 'changes data' : 'reads data'}</span></p>
      ${p.description ? `<p class="small muted">${esc(p.description)}</p>` : ''}<div class="small"><b>Input</b></div><pre>${esc(JSON.stringify(p.input, null, 2))}</pre>
      <p class="small muted">Configured in <code>config/integrations/${esc(p.system)}.json</code>. Failed calls are retried per that system's policy; see the Integrations screen for the call log.</p>`;
  } else if (p?.kind === 'rules') {
    work = `<h3>Rules: ${esc(p.result.name)} <span class="muted">(${esc(p.result.ruleSet)} v${p.result.version})</span></h3>${renderRuleResult(p.result)}`;
  }
  el.innerHTML = `<h2>${esc(g.headline)}</h2>
    <div><span class="chip ${g.mode}">${g.mode}</span><span class="small muted">${esc(g.modeExplanation)}</span></div>
    ${g.exception ? `<div class="alert bad"><b>Exception:</b> ${esc(g.exception)}</div>` : ''}
    ${g.alerts.map((a) => `<div class="alert">${esc(a)}</div>`).join('')}
    ${state.ai.enabled ? `<div class="ai" id="aiBox"><div class="head"><h3>Claude</h3><button class="btn secondary" id="aiAsk">Ask Claude</button></div><div id="aiBody" class="small muted">Get a case-specific briefing, risks found in the data${p?.kind === 'email' ? ', and a rewritten email draft' : ''}.</div></div>` : ''}
    <h3>Guidance</h3><p>${esc(g.guidance)}</p>
    ${g.regulatoryRef ? `<p class="small"><b>Reference:</b> ${esc(g.regulatoryRef)}</p>` : ''}
    ${g.checklist.length ? `<h3>Checklist</h3><ul class="check">${g.checklist.map((c, i) => `<li><label style="display:inline;font-weight:400"><input type="checkbox" style="width:auto" data-ck="${i}"> ${esc(c)}</label></li>`).join('')}</ul>` : ''}
    ${work}${g.prepareError ? `<div class="alert bad">${esc(g.prepareError)}</div>` : ''}
    <label>Notes</label><input id="notes" placeholder="What you checked / why" />
    <div class="actions" id="taskActions">
      ${g.allowedActions.includes('approve') ? '<button class="btn" data-act="approve">Approve &amp; execute</button>' : ''}
      ${g.allowedActions.includes('confirm') ? '<button class="btn" data-act="confirm">Confirm done</button>' : ''}
      ${g.allowedActions.includes('retry') ? '<button class="btn" data-act="retry">Retry</button>' : ''}
      ${g.allowedActions.includes('override') ? '<button class="btn danger" data-act="override">Override (with justification)</button>' : ''}
      <button class="btn secondary" data-act="reassign">Reassign</button>
    </div>`;
  el.querySelector('#taskActions').onclick = (e) => guarded(async () => {
    const act = e.target.dataset.act; if (!act) return;
    const notes = $('#notes').value;
    if (act === 'reassign') { const t = await api(`/tasks/${taskId}/reassign`, { method: 'POST', body: {} }); toast(t.assigneeId ? `Reassigned to ${t.assigneeId}` : 'Returned to queue'); state.selTask = null; return render(); }
    const boxes = [...el.querySelectorAll('[data-ck]')];
    if ((act === 'confirm' || act === 'approve') && boxes.some((b) => !b.checked)) throw new Error('Complete the checklist first');
    const body = { notes, override: act === 'override' };
    if ($('#subj')) { body.edits = { subject: $('#subj').value, body: $('#body').value }; body.draftSource = el.dataset.draftSource || 'template'; }
    if ($('#agentOut') && act === 'approve') {
      try { body.edits = { output: JSON.parse($('#agentOut').value) }; } catch { throw new Error('The edited result is not valid JSON'); }
    }
    await api(`/tasks/${taskId}/complete`, { method: 'POST', body });
    toast('Done'); state.selTask = null; render();
  });
  $('#agentRerun')?.addEventListener('click', () => guarded(async () => {
    const b = $('#agentRerun'); b.disabled = true; b.textContent = 'Agent is working…';
    try { await api(`/tasks/${taskId}/agent/run`, { method: 'POST', body: {} }); toast('New proposal ready'); } finally { renderTaskDetail(el, taskId); }
  }));
  if (state.ai.enabled) {
    el.dataset.draftSource = 'template';
    const template = p?.kind === 'email' ? { subject: p.subject, body: p.body } : null;
    const show = (a) => renderAiAssist($('#aiBody'), a, el, template);
    $('#aiAsk').onclick = () => guarded(async () => {
      const btn = $('#aiAsk'); const regen = btn.dataset.has === '1';
      btn.disabled = true; btn.textContent = 'Claude is reviewing…';
      try { const a = await api(`/tasks/${taskId}/ai-assist`, { method: 'POST', body: { refresh: regen } }); show(a); btn.dataset.has = '1'; }
      finally { btn.disabled = false; btn.textContent = $('#aiAsk').dataset.has === '1' ? 'Regenerate' : 'Ask Claude'; }
    });
    const prior = await api(`/tasks/${taskId}/ai-assist`).catch(() => null);
    if (prior) { show(prior); $('#aiAsk').dataset.has = '1'; $('#aiAsk').textContent = 'Regenerate'; }
  }
}

function renderAiAssist(box, a, detailEl, template) {
  const d = a.emailDraft;
  box.classList.remove('muted');
  box.innerHTML = `<p style="font-size:14px">${esc(a.briefing)}</p>
    ${a.risks.map((r) => `<div class="alert ${r.severity}"><span class="chip">${r.severity}</span>${esc(r.message)}</div>`).join('')}
    ${a.checks.length ? `<b>Also check</b><ul>${a.checks.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
    ${d ? `<b>Suggested email</b> <span class="muted">${esc(d.changes)}</span>
      ${d.missingFacts.length ? `<div class="alert high">This draft dropped required facts: ${d.missingFacts.map(esc).join(', ')}. It can't be sent until they're restored.</div>` : ''}
      <pre style="margin:6px 0">${esc(d.subject)}\n\n${esc(d.body)}</pre>
      <div class="actions" style="margin-top:6px"><button class="btn secondary" id="aiUse">Use Claude's draft</button>${template ? '<button class="btn secondary" id="aiRevert">Back to template</button>' : ''}</div>` : ''}
    <div class="muted" style="margin-top:6px">Advisory. Generated by ${esc(a.servedBy)}${a.servedBy !== a.model ? ` (fallback from ${esc(a.model)})` : ''}${a.cached ? ' · saved result' : ''} · verify before acting.</div>`;
  const use = box.querySelector('#aiUse');
  if (use) use.onclick = () => { $('#subj').value = d.subject; $('#body').value = d.body; detailEl.dataset.draftSource = 'ai'; toast("Claude's draft loaded into the editor"); };
  const rev = box.querySelector('#aiRevert');
  if (rev) rev.onclick = () => { $('#subj').value = template.subject; $('#body').value = template.body; detailEl.dataset.draftSource = 'template'; };
}

  $('#detail').innerHTML = `<h2>${esc(def.name)} <span class="muted small">${esc(def.id)} v${def.version}</span></h2>
    ${def.description ? `<p>${esc(def.description)}</p>` : ''}
    <p class="small"><b>Used by:</b> ${meta.usedBy.map(esc).join(', ') || (meta.overriddenBy.length ? 'client override' : '—')}${meta.overriddenBy.length ? ` · <b>replaces the standard set for:</b> ${meta.overriddenBy.map(esc).join(', ')}` : ''}</p>
    ${(def.decisions || []).map((d) => `<h3>Decision: ${esc(d.id)}</h3><div class="scroll"><table><tr><th>#</th><th>When</th><th>Then</th></tr>${d.rows.map((r, i) => `<tr><td>${i + 1}</td><td>${r.when ? code(r.when) : '<i>otherwise</i>'}</td><td class="small">${esc(JSON.stringify(r.then))}</td></tr>`).join('')}</table></div>`).join('')}
    ${def.outputs?.length ? `<h3>Calculated outputs</h3><div class="scroll"><table><tr><th>Output</th><th>Expression</th></tr>${def.outputs.map((o) => `<tr><td>${esc(o.label || o.name)}<div class="small muted">${esc(o.name)}</div></td><td>${code(o.expr)}</td></tr>`).join('')}</table></div>` : ''}
    <h3>Rules</h3><div class="scroll"><table><tr><th>Rule</th><th>Severity</th><th>Checks</th></tr>${(def.rules || []).map((r) => `<tr><td><b>${esc(r.id)}</b><div class="small muted">${esc(r.message)}</div></td><td><span class="chip">${r.severity || 'error'}</span></td><td>${r.when ? `<div class="small muted">when ${code(r.when)}</div>` : ''}${code(r.assert)}</td></tr>`).join('')}</table></div>
    <h3>Test cases</h3><div id="ruleTests" class="small">${(def.tests || []).map((t) => `<div>${esc(t.name)}</div>`).join('')}</div>
    <div class="actions"><button class="btn secondary" id="runTests">Run tests</button></div>
    <h3>Try it on a case</h3><div class="row"><select id="tryCase">${cases.map((c) => `<option value="${c.id}">${esc(c.sponsorName)} — ${c.type} (${c.status})</option>`).join('')}</select><button class="btn" id="tryBtn" style="flex:0 0 auto">Evaluate</button></div>
    <p class="small muted">Read-only: evaluates the rule set against the case's current data without changing anything.</p>
    <div id="tryOut"></div>`;
  $('#runTests').onclick = () => guarded(async () => {
    const out = await api(`/rules/${def.id}/test`, { method: 'POST', body: {} });
    $('#ruleTests').innerHTML = out.map((t) => `<div class="alert ${t.passed ? 'low' : 'bad'}"><span class="chip ${t.passed ? 'DONE' : 'exception'}">${t.passed ? 'pass' : 'fail'}</span>${esc(t.name)}${t.failures.length ? `<div class="small">${t.failures.map(esc).join('<br>')}</div>` : ''}</div>`).join('');
  });
  $('#tryBtn').onclick = () => guarded(async () => {
    const { result } = await api(`/rules/${def.id}/evaluate`, { method: 'POST', body: { caseId: $('#tryCase').value } });
    $('#tryOut').innerHTML = renderRuleResult(result);
  });
}

// ---------------------------------------------------------------- integrations
async function renderIntegrations(v) {
  const [systems, calls] = await Promise.all([api('/integrations'), api('/integrations/calls?limit=40')]);
  v.innerHTML = `<div class="panel" style="margin-bottom:16px"><h2>External systems (${systems.length})</h2>
    <p class="small muted">Defined in <code>config/integrations/*.json</code>: URL, authentication, timeouts, retries and the operations steps may call. Secrets come from environment variables and are never shown or logged.</p>
    ${systems.map((s) => `<div class="item" style="cursor:default">
      <div class="row" style="align-items:flex-start"><div style="flex:3"><b>${esc(s.name)}</b> <span class="muted small">${esc(s.id)}</span>
        <div class="small muted">${esc(s.description)}</div></div>
        <div style="flex:0 0 auto" class="admin-only"><button class="btn secondary" data-test="${s.id}">Test connection</button></div></div>
      <div class="small" style="margin-top:6px"><span class="chip ${s.mock ? 'MANUAL' : 'DONE'}">${s.mock ? 'built-in mock' : 'live'}</span><code>${esc(s.baseUrl)}</code></div>
      <div class="small" style="margin-top:4px">Auth: <b>${esc(s.auth)}</b> ${s.secrets.map((x) => `<span class="chip ${x.set ? 'DONE' : 'exception'}">${esc(x.env)}: ${x.set ? (s.mock ? 'not needed (mock)' : 'set') : 'missing'}</span>`).join('')}
        · timeout ${s.timeoutMs} ms · up to ${s.retry.attempts} attempts</div>
      <div class="small" id="test-${s.id}"></div>
      <div class="scroll" style="margin-top:6px"><table class="small"><tr><th>Operation</th><th>Request</th><th>Retry-safe</th><th>Used by</th></tr>
        ${s.operations.map((o) => `<tr><td><b>${esc(o.name)}</b><div class="muted">${esc(o.description)}</div></td><td><span class="chip">${o.method}</span><code>${esc(o.path)}</code></td><td>${o.idempotent ? 'yes' : 'no'}</td><td>${o.usedBy.map(esc).join('<br>') || '<span class="muted">built-in actions</span>'}</td></tr>`).join('')}
      </table></div></div>`).join('')}</div>
    <div class="panel"><h2>Recent calls</h2><p class="small muted">Method, path, outcome and timing only. Request and response bodies are not stored because they can contain personal data.</p>
    <div class="scroll"><table class="small"><tr><th>When</th><th>Call</th><th>Path</th><th>Status</th><th>Attempts</th><th>Time</th><th>For</th></tr>
      ${calls.map((c) => `<tr><td>${fmtDate(c.at)}</td><td>${esc(c.system)}.${esc(c.operation)}</td><td><span class="chip">${c.method}</span><code>${esc(c.path)}</code></td>
        <td><span class="chip ${c.ok ? 'DONE' : 'exception'}">${c.status ?? 'error'}</span>${c.error ? `<div style="color:var(--bad)">${esc(c.error)}</div>` : ''}</td><td>${c.attempts}</td><td>${c.durationMs} ms</td><td>${esc(c.actor || '')}${c.caseId ? `<div class="muted">${esc(c.caseId)}</div>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">No calls yet.</td></tr>'}
    </table></div></div>`;
  v.querySelectorAll('[data-test]').forEach((b) => (b.onclick = () => guarded(async () => {
    const id = b.dataset.test; const out = $('#test-' + id); out.textContent = 'Testing…';
    const r = await api(`/integrations/${id}/test`, { method: 'POST', body: {} });
    out.innerHTML = `<div class="alert ${r.ok ? 'low' : 'bad'}">${r.ok ? 'Connected' : 'Failed'}: ${esc(r.message)}${r.durationMs !== undefined ? ` (${r.durationMs} ms)` : ''}</div>`;
  })));
}

// ---------------------------------------------------------------- agents
async function renderAgents(v) {
  const agents = await api('/agents');
  v.innerHTML = `<div class="panel"><h2>AI agents (${agents.length})</h2>
    <p class="small muted">Defined in <code>config/agents/*.json</code>. A playbook step runs one with <code>"type": "ai.agent"</code>. The agent sees only its configured input, can call only read-only lookups, and must return the output schema. Its result is a proposal that a person approves or edits; steps that run an agent must be in REVIEW mode.</p>
    ${agents.map((a) => `<div class="item" style="cursor:default">
      <b>${esc(a.name)}</b> <span class="muted small">${esc(a.id)} v${a.version}</span>
      <span class="chip ${a.enabled ? 'DONE' : 'exception'}">${a.enabled ? 'model available' : 'AI not configured: manual entry'}</span>
      <div class="small muted">${esc(a.description || '')}</div>
      <div class="small" style="margin-top:4px"><b>Used by:</b> ${a.usedBy.map(esc).join(', ') || '—'} · effort ${esc(a.effort || 'medium')} · up to ${a.maxToolCalls ?? 5} tool calls</div>
      <h3>Instructions</h3><pre>${esc(a.instructions)}</pre>
      <h3>Input (the only case data it sees)</h3><div class="scroll"><table class="small">${Object.entries(a.input).map(([k, e]) => `<tr><td><b>${esc(k)}</b></td><td><code>${esc(String(e).replace(/^=/, ''))}</code></td></tr>`).join('')}</table></div>
      <h3>Tools (read-only)</h3>${(a.tools || []).map((t) => `<div class="small"><b>${esc(t.name)}</b> → <code>${esc(t.system)}.${esc(t.operation)}</code> <span class="muted">${esc(t.description)}</span></div>`).join('') || '<div class="small muted">None</div>'}
      <h3>Output</h3><div class="scroll"><table class="small">${Object.entries(a.output.properties || {}).map(([k, s]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(Array.isArray(s.type) ? s.type.join(' | ') : s.type || 'enum')}${s.enum ? ': ' + s.enum.map(esc).join(', ') : ''}${s.items?.properties ? ` of {${Object.keys(s.items.properties).map(esc).join(', ')}}` : ''}</td><td class="muted">${esc(s.description || '')}</td></tr>`).join('')}</table></div>
    </div>`).join('')}</div>`;
}

const VIEWS = { inbox: renderInbox, intake: renderIntake, cases: renderCases, team: renderTeam, rules: renderRules, integrations: renderIntegrations, agents: renderAgents, trac: renderTrac, outbox: renderOutbox, insights: renderInsights };
async function render() { const v = $('#view'); await guarded(() => VIEWS[state.tab](v)); loadUsers().catch(() => {}); }

async function loadUsers() {
  const users = await api('/users');
  if (state.mode === 'dev') {
    let saved = null; try { saved = localStorage.getItem('planops.user'); } catch {}
    state.user = state.user ?? (users.some((u) => u.id === saved) ? saved : users[0]?.id);
    $('#userSel').innerHTML = users.filter((u) => u.active).map((u) => `<option value="${u.id}" ${u.id === state.user ? 'selected' : ''}>${esc(u.name)} (${u.openTasks})</option>`).join('');
  }
  const me = users.find((u) => u.id === state.user);
  state.myCount = me?.openTasks ?? 0;
  // The server enforces the admin role; the UI only hides controls you can't use.
  state.isAdmin = !!me?.roles?.includes('admin');
  document.body.classList.toggle('is-admin', state.isAdmin);
  renderTabs();
}

/** Signed-in user card with a sign-out button (single sign-on only). */
function renderWho(user) {
  const initials = user.name.split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  const who = $('#who');
  who.hidden = false;
  who.innerHTML = `<span class="avatar" aria-hidden="true">${esc(initials)}</span><div><b>${esc(user.name)}</b><span>${esc(user.email)}</span></div><button class="btn secondary" id="signOut">Sign out</button>`;
  $('#signOut').onclick = () => guarded(async () => { await fetch('/auth/logout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); location.href = '/auth/signed-out'; });
}

async function boot() {
  const me = await api('/me');
  state.mode = me.mode;
  document.body.classList.toggle('sso', me.mode === 'oidc');
  document.body.classList.toggle('dev-mode', me.mode === 'dev');
  if (me.mode === 'oidc') { state.user = me.user.id; renderWho(me.user); }
  await Promise.all([loadUsers(), api('/ai/status').then((s) => (state.ai = s)).catch(() => {})]);
  renderTabs(); render();
}
setInterval(() => { if (state.mode && state.tab !== 'intake' && state.tab !== 'team' && !document.activeElement?.matches('input,textarea')) loadUsers().catch(() => {}); }, 5000);
boot().catch((e) => toast(e.message, true));
</script>
</body>
</html>
